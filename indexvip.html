<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRA OPENHOUSE 2027 - กิจกรรมฐานการเรียนรู้ทางการแพทย์ (VIP)</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cra: { 50: '#f0f9ff', 100: '#e0f2fe', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#1e3a8a' },
                        orange: { 50: '#fff7ed', 500: '#f97316', 600: '#ea580c' },
                        vip: { 50: '#fefce8', 100: '#fef9c3', 200: '#fef08a', 300: '#fde047', 400: '#facc15', 500: '#eab308', 600: '#ca8a04', 700: '#a16207', 800: '#854d0e', 900: '#713f12' }
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Noto Sans Thai', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f8fafc; overflow-x: hidden;}
        
        .floating-bg { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: -40; }
        .float-icon { position: absolute; bottom: -10%; opacity: 0; color: rgba(234, 179, 8, 0.05); animation: floatUp linear infinite; }
        @keyframes floatUp { 0% { transform: translateY(10vh) rotate(0deg) scale(0.8); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-110vh) rotate(360deg) scale(1.5); opacity: 0; } }

        .btn-primary { background: linear-gradient(135deg, #a16207 0%, #eab308 100%); color: white; transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); box-shadow: 0 10px 25px -5px rgba(234, 179, 8, 0.4); border-radius: 1.25rem;}
        .btn-primary:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 15px 35px -5px rgba(234, 179, 8, 0.5); background: linear-gradient(135deg, #ca8a04 0%, #facc15 100%); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: none; transform: none; }
        
        .btn-outline { background: white; color: #a16207; border: 2px solid #eab308; transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); border-radius: 1.25rem;}
        .btn-outline:hover { background: #fefce8; transform: translateY(-3px); box-shadow: 0 10px 20px -5px rgba(234, 179, 8, 0.2); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col items-center justify-center relative p-4">

    <!-- Background Elements -->
    <div class="fixed top-[-10%] left-[-10%] w-[50%] h-[50%] bg-vip-500 rounded-full mix-blend-multiply filter blur-[120px] opacity-15 pointer-events-none z-[-1]"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-orange-400 rounded-full mix-blend-multiply filter blur-[120px] opacity-10 pointer-events-none z-[-1]"></div>
    
    <div class="floating-bg">
        <i class="fi fi-sr-star float-icon" style="left: 15%; font-size: 4rem; animation-duration: 25s; animation-delay: 0s;"></i>
        <i class="fi fi-sr-crown float-icon" style="left: 75%; font-size: 6rem; animation-duration: 22s; animation-delay: 5s;"></i>
        <i class="fi fi-sr-sparkles float-icon" style="left: 50%; font-size: 3rem; animation-duration: 18s; animation-delay: 2s;"></i>
    </div>

    <!-- Main Card -->
    <div class="bg-white/90 backdrop-blur-md p-10 md:p-14 text-center max-w-2xl w-full rounded-[3rem] shadow-2xl border border-white relative z-10 animate-[fadeIn_0.6s_ease-out]">
        
        <div class="w-24 h-24 bg-gradient-to-br from-vip-100 to-orange-100 rounded-[2rem] flex items-center justify-center mx-auto mb-6 shadow-inner border border-vip-200">
            <i class="fi fi-sr-crown text-5xl text-vip-600 mt-2"></i>
        </div>
        
        <h1 class="text-4xl md:text-5xl font-black text-vip-900 mb-4 tracking-tight">CRA OPENHOUSE <span class="text-transparent bg-clip-text bg-gradient-to-r from-vip-600 to-orange-500">2027</span></h1>
        
        <div class="inline-block bg-vip-50 border border-vip-200 rounded-full px-5 py-2 mb-4 shadow-sm">
            <p class="text-lg md:text-xl font-bold text-vip-700">กิจกรรมฐานการเรียนรู้ทางการแพทย์ (VIP)</p>
        </div>
        
        <p class="text-slate-500 font-medium mb-10 text-sm md:text-base"><i class="fi fi-sr-calendar text-orange-400 mr-2"></i> 11 ตุลาคม 2570 | <i class="fi fi-sr-marker text-orange-400 mx-2"></i> โรงพยาบาลจุฬาภรณ์</p>

        <!-- Loading State for Quota (Optional/Visual Only) -->
        <div id="quotaStatus" class="mb-8 font-bold text-vip-600 animate-pulse bg-vip-50 py-3 rounded-xl border border-vip-200">
            <i class="fi fi-sr-spinner-third animate-spin mr-2"></i> กำลังตรวจสอบที่นั่งว่าง...
        </div>

        <div class="flex flex-col gap-4 w-full md:w-4/5 mx-auto hidden" id="actionButtons">
            <!-- Go to Registration -->
            <a href="vipreg.html" id="btnReg" class="btn-primary w-full py-5 font-black text-xl flex items-center justify-center gap-3 no-underline">
                ลงทะเบียน VIP <i class="fi fi-sr-arrow-right mt-1"></i>
            </a>

            <!-- Full Quota Notice (Hidden by default) -->
            <div id="btnClosed" class="w-full bg-slate-100 text-slate-400 py-5 rounded-2xl font-black text-xl flex items-center justify-center gap-3 hidden cursor-not-allowed border-2 border-slate-200">
                <i class="fi fi-sr-lock mt-1"></i> สิทธิ์เต็ม / ปิดการลงทะเบียน
            </div>

            <!-- Go to E-PASS -->
            <a href="epass2.html" class="btn-outline w-full py-4 font-bold text-lg flex items-center justify-center gap-2 no-underline">
                <i class="fi fi-sr-id-badge mt-0.5"></i> เข้าสู่ระบบดูบัตร E-PASS
            </a>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxvCCFUo3KnDeUG4t0snFAi_dZBxJ40s6lOlVFDB80Dxh_QSwnFfW4qAknOeh2llK3SLw/exec"; 
        const TOTAL_SEATS = 108; // 12 Groups * 9 Seats

        window.onload = () => {
            // Check Quota to toggle buttons
            fetch(SCRIPT_URL + "?action=getQuotas&type=vip")
                .then(r => r.json())
                .then(data => {
                    let totalUsed = 0;
                    for(let i = 1; i <= 12; i++) { totalUsed += (data['G' + i] || 0); }
                    
                    document.getElementById('quotaStatus').style.display = 'none';
                    document.getElementById('actionButtons').classList.remove('hidden');

                    if(totalUsed >= TOTAL_SEATS) {
                        document.getElementById('btnReg').classList.add('hidden');
                        document.getElementById('btnClosed').classList.remove('hidden');
                    }
                })
                .catch(e => {
                    // Fallback if failed: allow registration button to show anyway
                    document.getElementById('quotaStatus').style.display = 'none';
                    document.getElementById('actionButtons').classList.remove('hidden');
                });
        };
    </script>
</body>
</html>
